<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resume Builder</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171d2b;
    --panel-2: #1e2637;
    --border: #2a344a;
    --text: #e7ecf5;
    --muted: #9aa7bd;
    --accent: #4f8cff;
    --accent-2: #1a3c6e;
    --danger: #e5484d;
    --ok: #30a46c;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  header select { min-width: 120px; }
  @media (max-width: 820px) {
    header .spacer { display: none; }
    header select { flex: 1; }
  }
  select, button, input, textarea {
    font: inherit; color: var(--text);
  }
  select, input, textarea {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; width: 100%;
  }
  textarea { resize: vertical; min-height: 62px; line-height: 1.45; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; transition: .15s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; }
  button.small { padding: 4px 9px; font-size: 12px; }
  button.danger { color: var(--danger); border-color: transparent; background: transparent; }
  button.danger:hover { border-color: var(--danger); }
  .layout { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 57px); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .editor { border-right: 0; border-bottom: 1px solid var(--border); }
  }
  .editor { overflow-y: auto; padding: 20px 24px 80px; border-right: 1px solid var(--border); }
  .preview { background: #333a; display: flex; flex-direction: column; }
  .preview .bar { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .preview iframe { flex: 1; border: 0; width: 100%; background: #52586a; }
  .preview .empty { flex:1; display:flex; align-items:center; justify-content:center; color: var(--muted); flex-direction: column; gap: 10px; }
  fieldset {
    border: 1px solid var(--border); border-radius: var(--radius);
    margin: 0 0 18px; padding: 14px 16px 16px; background: var(--panel);
  }
  legend { padding: 0 8px; font-weight: 650; font-size: 13px; letter-spacing: .4px; text-transform: uppercase; color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .card {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    margin: 10px 0; background: var(--panel-2);
  }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .card-head .title { font-weight: 600; font-size: 13px; flex: 1; color: var(--muted); }
  .bullet { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
  .bullet textarea { min-height: 48px; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px; }
  .tag button { border: 0; background: transparent; color: #cdd; padding: 0 4px; cursor: pointer; }
  .add-inline { display: flex; gap: 8px; margin-top: 8px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ok); color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .status { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>📄 Resume Builder</h1>
  <label style="margin:0;color:var(--muted)">Resume</label>
  <select id="resumeSelect" style="width:auto"></select>
  <label style="margin:0;color:var(--muted)">Template</label>
  <select id="templateSelect" style="width:auto"></select>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <button class="ghost small" id="newBtn">+ New</button>
  <button class="ghost" id="saveBtn">💾 Save</button>
  <button class="primary" id="renderBtn">⚙️ Render PDF</button>
</header>

<div class="layout">
  <div class="editor" id="editor"><!-- form injected here --></div>
  <div class="preview">
    <div class="bar" id="previewBar">Preview — click “Render PDF” to generate.</div>
    <div class="empty" id="previewEmpty">
      <div style="font-size:40px">📃</div>
      <div>No PDF yet. Edit the fields and hit <b>Render PDF</b>.</div>
    </div>
    <iframe id="previewFrame" style="display:none"></iframe>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let state = {};          // current resume data
let currentName = "";    // current resume file stem

function toast(msg, err=false) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  setTimeout(() => t.className = "toast", 2200);
}

// ---------- rendering the editor form ----------
function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "value") n.value = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c =>
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
}

function textField(labelText, value, onInput, textarea=false) {
  const wrap = el("div");
  wrap.appendChild(el("label", {}, labelText));
  const field = textarea
    ? el("textarea", { oninput: e => onInput(e.target.value) }, value ?? "")
    : el("input", { value: value ?? "", oninput: e => onInput(e.target.value) });
  wrap.appendChild(field);
  return wrap;
}

function renderEditor() {
  const root = $("#editor");
  root.innerHTML = "";
  state.contact = state.contact || {};

  // --- Basics ---
  const basics = el("fieldset");
  basics.appendChild(el("legend", {}, "Basics"));
  basics.appendChild(textField("Full name", state.name, v => state.name = v));
  basics.appendChild(textField("Title / Role", state.title, v => state.title = v));
  const c = el("div", { class: "row-3" });
  c.appendChild(textField("Email", state.contact.email, v => state.contact.email = v));
  c.appendChild(textField("Phone", state.contact.phone, v => state.contact.phone = v));
  c.appendChild(textField("LinkedIn URL", state.contact.linkedin, v => state.contact.linkedin = v));
  basics.appendChild(c);
  basics.appendChild(textField("Professional summary", state.summary, v => state.summary = v, true));
  root.appendChild(basics);

  // --- Core competencies ---
  root.appendChild(competenciesSection());

  // --- Experience ---
  root.appendChild(experienceSection());

  // --- Education ---
  root.appendChild(educationSection());

  // --- Certifications ---
  root.appendChild(simpleListSection("Certifications", "certifications"));
}

function competenciesSection() {
  const fs = el("fieldset");
  fs.appendChild(el("legend", {}, "Core Competencies"));
  state.competencies = state.competencies || [];
  state.competencies.forEach((group, gi) => {
    group.items = group.items || [];
    const card = el("div", { class: "card" });
    const head = el("div", { class: "card-head" });
    head.appendChild(el("input", { value: group.category ?? "", placeholder: "Category",
      oninput: e => group.category = e.target.value }));
    head.appendChild(el("button", { class: "danger small",
      onclick: () => { state.competencies.splice(gi, 1); renderEditor(); } }, "Remove"));
    card.appendChild(head);

    const tags = el("div", { class: "tag-list" });
    group.items.forEach((item, ii) => {
      const t = el("span", { class: "tag" }, item);
      t.appendChild(el("button", { onclick: () => { group.items.splice(ii, 1); renderEditor(); } }, "×"));
      tags.appendChild(t);
    });
    card.appendChild(tags);

    const add = el("div", { class: "add-inline" });
    const inp = el("input", { placeholder: "Add skill and press Enter",
      onkeydown: e => { if (e.key === "Enter" && e.target.value.trim()) {
        group.items.push(e.target.value.trim()); renderEditor(); } } });
    add.appendChild(inp);
    card.appendChild(add);
    fs.appendChild(card);
  });
  fs.appendChild(el("button", { class: "ghost small", onclick: () => {
    state.competencies.push({ category: "", items: [] }); renderEditor(); } }, "+ Add category"));
  return fs;
}

function experienceSection() {
  const fs = el("fieldset");
  fs.appendChild(el("legend", {}, "Work Experience"));
  state.experience = state.experience || [];
  state.experience.forEach((role, ri) => {
    role.highlights = role.highlights || [];
    const card = el("div", { class: "card" });
    const head = el("div", { class: "card-head" });
    head.appendChild(el("span", { class: "title" }, role.company || "New role"));
    head.appendChild(el("button", { class: "danger small",
      onclick: () => { state.experience.splice(ri, 1); renderEditor(); } }, "Remove"));
    card.appendChild(head);

    const r1 = el("div", { class: "row" });
    r1.appendChild(textField("Company", role.company, v => { role.company = v; }));
    r1.appendChild(textField("Dates", role.dates, v => role.dates = v));
    card.appendChild(r1);
    const r2 = el("div", { class: "row" });
    r2.appendChild(textField("Role / Title", role.role, v => role.role = v));
    r2.appendChild(textField("Location", role.location, v => role.location = v));
    card.appendChild(r2);

    card.appendChild(el("label", {}, "Highlights"));
    role.highlights.forEach((pt, pi) => {
      const b = el("div", { class: "bullet" });
      b.appendChild(el("textarea", { value: pt, oninput: e => role.highlights[pi] = e.target.value }, pt));
      b.appendChild(el("button", { class: "danger small",
        onclick: () => { role.highlights.splice(pi, 1); renderEditor(); } }, "×"));
      card.appendChild(b);
    });
    card.appendChild(el("button", { class: "ghost small", onclick: () => {
      role.highlights.push(""); renderEditor(); } }, "+ Add bullet"));
    fs.appendChild(card);
  });
  fs.appendChild(el("button", { class: "ghost small", onclick: () => {
    state.experience.push({ company: "", role: "", location: "", dates: "", highlights: [""] });
    renderEditor(); } }, "+ Add role"));
  return fs;
}

function educationSection() {
  const fs = el("fieldset");
  fs.appendChild(el("legend", {}, "Education"));
  state.education = state.education || [];
  state.education.forEach((edu, ei) => {
    const card = el("div", { class: "card" });
    const head = el("div", { class: "card-head" });
    head.appendChild(el("span", { class: "title" }, edu.degree || "New entry"));
    head.appendChild(el("button", { class: "danger small",
      onclick: () => { state.education.splice(ei, 1); renderEditor(); } }, "Remove"));
    card.appendChild(head);
    card.appendChild(textField("Degree", edu.degree, v => { edu.degree = v; }));
    const r = el("div", { class: "row" });
    r.appendChild(textField("Institution", edu.institution, v => edu.institution = v));
    r.appendChild(textField("Dates", edu.dates, v => edu.dates = v));
    card.appendChild(r);
    fs.appendChild(card);
  });
  fs.appendChild(el("button", { class: "ghost small", onclick: () => {
    state.education.push({ degree: "", institution: "", dates: "" }); renderEditor(); } }, "+ Add education"));
  return fs;
}

function simpleListSection(title, key) {
  const fs = el("fieldset");
  fs.appendChild(el("legend", {}, title));
  state[key] = state[key] || [];
  state[key].forEach((item, i) => {
    const b = el("div", { class: "bullet" });
    b.appendChild(el("input", { value: item, oninput: e => state[key][i] = e.target.value }));
    b.appendChild(el("button", { class: "danger small",
      onclick: () => { state[key].splice(i, 1); renderEditor(); } }, "×"));
    fs.appendChild(b);
  });
  fs.appendChild(el("button", { class: "ghost small", onclick: () => {
    state[key].push(""); renderEditor(); } }, "+ Add item"));
  return fs;
}

// ---------- data / API ----------
async function loadList() {
  const r = await fetch("/api/resumes");
  const { resumes, templates } = await r.json();
  const rs = $("#resumeSelect"); rs.innerHTML = "";
  resumes.forEach(n => rs.appendChild(el("option", { value: n }, n)));
  const ts = $("#templateSelect"); ts.innerHTML = "";
  templates.forEach(n => ts.appendChild(el("option", { value: n }, n)));
  // default template to data-engineer if present
  if (templates.includes("data-engineer.tex")) ts.value = "data-engineer.tex";
  return resumes;
}

async function loadResume(name) {
  const r = await fetch("/api/resume/" + encodeURIComponent(name));
  if (!r.ok) { toast("Could not load " + name, true); return; }
  state = await r.json();
  currentName = name;
  renderEditor();
}

async function save() {
  const r = await fetch("/api/resume/" + encodeURIComponent(currentName), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(state)
  });
  const j = await r.json();
  if (j.ok) toast("Saved " + j.saved); else toast("Save failed", true);
}

async function render() {
  $("#status").textContent = "Rendering…";
  $("#renderBtn").disabled = true;
  try {
    const r = await fetch("/api/render", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: currentName, template: $("#templateSelect").value, data: state })
    });
    const j = await r.json();
    if (j.ok) {
      const url = j.pdf + "?t=" + Date.now();
      $("#previewEmpty").style.display = "none";
      const f = $("#previewFrame"); f.style.display = "block"; f.src = url;
      $("#previewBar").innerHTML = `Preview — <b>${currentName}.pdf</b> · saved to output/ · <a href="${url}" download style="color:var(--accent)">download</a>`;
      toast("Rendered & saved");
    } else {
      toast(j.error || "Render failed", true);
    }
  } catch (e) { toast("Render error: " + e, true); }
  $("#status").textContent = "";
  $("#renderBtn").disabled = false;
}

// ---------- wiring ----------
$("#resumeSelect").addEventListener("change", e => loadResume(e.target.value));
$("#saveBtn").addEventListener("click", save);
$("#renderBtn").addEventListener("click", render);
$("#newBtn").addEventListener("click", async () => {
  const name = prompt("New resume name (letters, numbers, dashes):");
  if (!name) return;
  const clean = name.trim().toLowerCase().replace(/[^a-z0-9-_]/g, "-");
  state = {
    name: "Your Name", title: "Your Title",
    contact: { email: "", phone: "", linkedin: "" },
    summary: "", competencies: [], experience: [], education: [], certifications: []
  };
  currentName = clean;
  await save();
  await loadList();
  $("#resumeSelect").value = clean;
  renderEditor();
  toast("Created " + clean);
});

(async function init() {
  const resumes = await loadList();
  if (resumes.length) { $("#resumeSelect").value = resumes.includes("sample") ? "sample" : resumes[0]; await loadResume($("#resumeSelect").value); }
})();
</script>
</body>
</html>
